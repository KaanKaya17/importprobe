name: MCP Registry
# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Run it by hand AFTER approving the staged npm version: the registry verifies the live npm
# package (its "mcpName" must match server.json). Auth is GitHub OIDC — no token stored.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MCP_PUBLISHER_VERSION: v1.8.16
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC login to the MCP Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: server.json matches package.json and the live npm package
        run: |
          v=$(node -p "require('./package.json').version")
          node -e '
            const s = require("./server.json"), p = require("./package.json");
            if (s.version !== p.version || s.packages[0].version !== p.version) throw new Error(`server.json version ${s.version}/${s.packages[0].version} != package.json ${p.version}`);
            if (s.name !== p.mcpName) throw new Error(`server.json name ${s.name} != package.json mcpName ${p.mcpName}`);
          '
          live=$(npm view "importprobe@$v" mcpName 2>/dev/null || true)
          [ "$live" = "$(node -p "require('./package.json').mcpName")" ] || { echo "importprobe@$v is not live on npm with the right mcpName yet (got '$live'). Approve the staged version first."; exit 1; }
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
